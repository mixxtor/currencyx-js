name: Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto = derive the bump from conventional commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: release') && !contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm i

      - name: Run tests
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
          npm run test --if-present

      - name: Build package
        run: npm run build --if-present

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # No increment argument: @release-it/conventional-changelog derives the bump from the commits
      # since the last tag (feat → minor, feat!/BREAKING CHANGE → major, anything else → patch).
      # `release:patch` here used to publish every merge as a patch, features included.
      - name: Release (Auto)
        if: github.event_name == 'push'
        run: npm run release -- --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release (Manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$RELEASE_TYPE" = "auto" ]; then
            npm run release -- --ci
          else
            npm run "release:$RELEASE_TYPE" -- --ci
          fi
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Success
        if: success()
        run: |
          echo "🎉 Release completed successfully!"
          echo "📦 Package published to NPM"
          echo "🏷️ GitHub release created"
